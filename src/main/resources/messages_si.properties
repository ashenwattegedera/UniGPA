index.feature.desc1=නව ලකුණුවල ඔබේ සමස්ත GPA වෙත බලපාම දැකන්න. අපි ඉන් ඔබ වෙනුවෙන් සංකීර්ණ බරින් සූත්‍ර පවතිනුවන්න කරන්න.
