index.feature.desc3=පරිවර්තකවලින් අධ්‍යාපනමය වැඩසටහන් එකවර ගිණුම් කිරීම. දෙගුණ උපාධි හෝ ගිණුම් නිර්දෙශ වෙනස් කිරීමට පරිපූර්ණ.
